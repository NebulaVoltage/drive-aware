<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" fill="none">
  <!-- Official Emblem Mark -->
  <g transform="translate(5, 5) scale(0.6)">
    <!-- Outer D-A Monogram Frame -->
    <path d="M 22 20 L 58 20 L 74 44 L 58 78 L 22 78 Z" fill="none" stroke="#F4F5F7" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" />
    <!-- Interlocking A Diagonal & Inner D-Loop -->
    <path d="M 22 78 L 60 22 L 78 48 M 22 20 L 22 78 M 38 48 L 74 48" stroke="#F4F5F7" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" />
    <!-- Vision Beam Cone -->
    <polygon points="50,48 88,26 88,70" fill="#DFFF00" />
    <!-- Optical Eye / Lens Iris Center -->
    <circle cx="50" cy="48" r="6" fill="#090A0C" stroke="#DFFF00" stroke-width="3" />
    <circle cx="50" cy="48" r="2" fill="#DFFF00" />
  </g>

  <!-- DRIVE Wordmark -->
  <text x="75" y="46" font-family="'Syne', 'Inter', sans-serif" font-weight="800" font-size="30" letter-spacing="3" fill="#F4F5F7">DRIVE</text>
  
  <!-- AWARE Wordmark -->
  <text x="185" y="46" font-family="'Syne', 'Inter', sans-serif" font-weight="800" font-size="30" letter-spacing="3" fill="#DFFF00">AWARE</text>
</svg>
